name: examples

on:
  push:
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages("glmnet")'
      - name: Run every example (06 with fewer runs)
        working-directory: R
        env:
          RUNS: "10"
          SUBSAMPLES: "30"
        run: for f in 0*.R; do echo "== $f"; Rscript "$f"; done
